services:
  concurrency-demo:
    build: .
    image: concurrency-demo:latest
    container_name: concurrency-demo
    ports:
      - "8080:8080"
    environment:
      # Uncomment to see JIT compilation and observe the non-volatile flag bug
      # JAVA_OPTS: "-XX:+PrintCompilation -XX:+UnlockDiagnosticVMOptions"

      # Low-latency GC that handles many threads well
      JAVA_OPTS: "-XX:+UseZGC -Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
