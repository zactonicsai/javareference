spring:
  application:
    name: concurrency-demo
  threads:
    virtual:
      # Spring Boot 3.2+ -- Tomcat uses virtual threads per request
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.demo.concurrency: DEBUG
